name: telezalupa-screenshoter

services:
  screenshoter:
    mem_limit: 1024m
    memswap_limit: 1280m
    cpus: 2
    cpu_shares: 1024
    pids_limit: 512
    image: ${SCREENSHOTER_IMAGE:?Set SCREENSHOTER_IMAGE in deployment.env}
    pull_policy: never
    container_name: tv-screenshoter
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tv_screenshoter}
      POSTGRES_USER: ${POSTGRES_USER:-tv_screenshoter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tv_screenshoter_password}
      DATABASE_URL: postgresql://${POSTGRES_USER:-tv_screenshoter}:${POSTGRES_PASSWORD:-tv_screenshoter_password}@postgres:5432/${POSTGRES_DB:-tv_screenshoter}?schema=public
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_DEFAULT_CHAT_ID: ${TELEGRAM_DEFAULT_CHAT_ID:-}
      TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TEMP_ADMIN_PASSWORD: ${TEMP_ADMIN_PASSWORD:-}
      COOKIE_SECURE: "false"
    ports:
      - "127.0.0.1:${PORT:-3000}:${PORT:-3000}"
    volumes:
      - screenshoter_data:/app/data
    networks:
      - default
      - proxy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get({host:'127.0.0.1',port:process.env.PORT||3000,path:'/api/health'},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 45s
      retries: 6
    logging:
      driver: "none"

  postgres:
    mem_limit: 512m
    memswap_limit: 640m
    cpus: 1
    cpu_shares: 1024
    pids_limit: 256
    image: ${POSTGRES_IMAGE:?Set POSTGRES_IMAGE in deployment.env}
    pull_policy: never
    container_name: tv-screenshoter-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tv_screenshoter}
      POSTGRES_USER: ${POSTGRES_USER:-tv_screenshoter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tv_screenshoter_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    external: true
    name: telezalupa-screenshoter_default
  proxy:
    external: true
    name: proxy

volumes:
  postgres_data:
    external: true
    name: telezalupa-screenshoter_postgres_data
  screenshoter_data:
    external: true
    name: telezalupa-screenshoter_screenshoter_data
